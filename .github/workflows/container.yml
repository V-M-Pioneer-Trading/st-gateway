name: container

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  # Manual redeploy. Added after a squash-merge to main (4395f78) produced no
  # workflow run at all — Actions enabled, trigger config correct, simply no
  # push event delivered — which left main's code ahead of the image on GHCR
  # with nothing to re-fire it. Without this the only recovery is pushing an
  # empty commit, which is worse than a button.
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # tsc covers the tests too (see tsconfig.json vs tsconfig.build.json).
      # Without this step nothing in CI ever ran the typecheck script.
      - run: npm run typecheck

      - run: npm test

  docker:
    # Anything that is not a PR: a push to main/tag, or a manual dispatch.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/v-m-pioneer-trading/st-gateway
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::543292785457:role/github-actions-ssm-deploy
          aws-region: eu-central-1

      # st-gateway has no Terraform stack of its own — it's bootstrapped
      # inside agent-service's SSM document (see meta/docs/operations.md,
      # "Backend hosting"). Triggering this document also restarts
      # agent-service's MySQL container as a side effect.
      - name: Trigger redeploy on shared host
        run: |
          aws ssm send-command \
            --document-name "agent-service-bootstrap-i-011b6b82a9072a385" \
            --targets "Key=InstanceIds,Values=i-011b6b82a9072a385" \
            --region eu-central-1
